name: CI
on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:

# Review M7 (Phase 8): the token can only read, whatever the repository default is.
permissions:
  contents: read

env:
  HOPLINE_HIDDEN: '1'

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.1  # same npm (11.6.2) as local dev: keeps package-lock.json stable
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    # All three OSes, like the Release workflow. Windows passes locally (RELEASING.md › Windows
    # e2e); macOS is reviewed statically only until a runner is available.
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: E2E (Electron + simulator)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            bash scripts/ci/electron-e2e-linux.sh
          else
            npm run e2e -w @hopline/desktop
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: apps/desktop/playwright-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-flaky-${{ matrix.os }}
          path: apps/desktop/test-results/flaky.json
          if-no-files-found: ignore
