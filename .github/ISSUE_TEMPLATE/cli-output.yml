name: Share a CLI fixture
description: Help Hopline recognize a command, parse a table, or mask private fields.
title: "[CLI] "
body:
  - type: input
    id: platform
    attributes:
      label: Platform and OS version
      placeholder: Cisco IOS XE 17.9
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Command and synthetic output
      description: Invent names and values. Keep the original line breaks, column spacing and CLI mode so someone can reproduce the behavior offline.
      render: text
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: What should Hopline recognize?
      description: Describe the expected table rows, command classification or labels to mask. For masking, include a field that should stay readable.
    validations:
      required: true
