name: Release
# The owner pushes a version tag on a commit already merged into main (RELEASING.md).
#   1. test     typecheck, unit tests and e2e on each OS (native runners). Nothing is packaged if one fails.
#   2. package  each OS builds natively and signs when its secrets exist (docs/SIGNING.md).
#   3. release  one job: staged-rollout stamp, SHA-256 sums, GPG signatures, one draft GitHub Release.
# Drafts are invisible to the auto-updater: publishing the draft is what ships the update.
#
# Signing secrets live in the protected GitHub Environment `release` (docs/SIGNING.md › "Protect
# the signing secrets"), whose deployment rule allows tags `v*` only. GitHub enforces that rule, so
# a branch copy of this file that drops the `if:` below still cannot read them. Dispatching on a
# branch runs the tests only; dispatch on a tag (or push one) to package and sign.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      staging_percentage:
        description: 'Staged rollout: share of installs offered the update (1-100). Raise it later with RELEASING.md › Staged rollout.'
        required: false
        default: '100'
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  HOPLINE_HIDDEN: '1'

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.1  # same npm (11.6.2) as local dev: keeps package-lock.json stable
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: E2E (Electron + simulator)
        shell: bash
        env:
          CI: '1'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run --auto-servernum npm run e2e -w @hopline/desktop
          else
            npm run e2e -w @hopline/desktop
          fi
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: apps/desktop/playwright-report

  release-source:
    name: Verify release source
    if: startsWith(github.ref, 'refs/tags/v') && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tagged commit and desktop version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse "HEAD^{commit}")
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main || {
            echo "::error::The release commit must already be merged into main."
            exit 1
          }
          version=$(node -p "require('./apps/desktop/package.json').version")
          [[ "$TAG" == "v$version" ]] || {
            echo "::error::The tag must match the desktop package version."
            exit 1
          }

  package:
    name: package (${{ matrix.name }})
    needs: [test, release-source]
    # Tags only: signing never runs on an unreviewed branch (M5). The environment holds the secrets.
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            script: dist:linux:all
          - name: windows
            os: windows-latest
            script: dist:win
          - name: macos
            # Apple Silicon runner; electron-builder packs arm64 and x64 in one run (one latest-mac.yml).
            os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.1
          cache: npm
      # Review M6 (Phase 8): no dependency install scripts in the job that signs. The build needs
      # none of them: better-sqlite3 and serialport ship N-API prebuilds (checked below and by
      # --smoke), ssh2 falls back to its JS crypto (its binding never loads under Electron), and
      # NSIS packaging does not use electron-winstaller's 7-Zip picker. A rebuild that does need a
      # script would go here, by name, with its prebuild (npm rebuild <pkg>), never a blanket one.
      - run: npm ci --ignore-scripts
      - name: Tools for rpm
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Package (signed when the secrets exist)
        shell: bash
        env:
          # Crash reports (D7): the DSN built into the release. Empty: reports need a DSN set by the user or the team policy.
          HOPLINE_SENTRY_DSN: ${{ secrets.HOPLINE_SENTRY_DSN }}
          # Update feed in a separate public repository (docs/SIGNING.md › Update feed); empty: this repository.
          HOPLINE_RELEASES_OWNER: ${{ vars.HOPLINE_RELEASES_OWNER }}
          HOPLINE_RELEASES_REPO: ${{ vars.HOPLINE_RELEASES_REPO }}
          # macOS (D6): Developer ID certificate, then notarization (API key or Apple ID).
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_BASE64: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_BASE64 || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          # Windows (D6), one of: Azure Artifact Signing…
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_SIGN_ENDPOINT: ${{ runner.os == 'Windows' && secrets.AZURE_SIGN_ENDPOINT || '' }}
          AZURE_SIGN_ACCOUNT: ${{ runner.os == 'Windows' && secrets.AZURE_SIGN_ACCOUNT || '' }}
          AZURE_SIGN_PROFILE: ${{ runner.os == 'Windows' && secrets.AZURE_SIGN_PROFILE || '' }}
          AZURE_SIGN_PUBLISHER: ${{ runner.os == 'Windows' && secrets.AZURE_SIGN_PUBLISHER || '' }}
          # …or SignPath.
          SIGNPATH_API_TOKEN: ${{ runner.os == 'Windows' && secrets.SIGNPATH_API_TOKEN || '' }}
          SIGNPATH_ORGANIZATION_ID: ${{ runner.os == 'Windows' && secrets.SIGNPATH_ORGANIZATION_ID || '' }}
          SIGNPATH_PROJECT_SLUG: ${{ runner.os == 'Windows' && secrets.SIGNPATH_PROJECT_SLUG || '' }}
          SIGNPATH_POLICY_SLUG: ${{ runner.os == 'Windows' && secrets.SIGNPATH_POLICY_SLUG || '' }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ runner.os == 'Windows' && secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || '' }}
          # The certificate's subject CN: the updater verifies installers against it (required with SignPath).
          SIGNPATH_PUBLISHER: ${{ runner.os == 'Windows' && secrets.SIGNPATH_PUBLISHER || '' }}
        run: |
          # A missing secret arrives as "", and electron-builder reads CSC_LINK="" as a path. Pass on
          # only the ones that are set (electron-builder.config.cjs decides what to sign from them).
          for v in HOPLINE_SENTRY_DSN CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_ID \
                   APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET \
                   AZURE_SIGN_ENDPOINT AZURE_SIGN_ACCOUNT AZURE_SIGN_PROFILE AZURE_SIGN_PUBLISHER SIGNPATH_API_TOKEN \
                   SIGNPATH_ORGANIZATION_ID SIGNPATH_PROJECT_SLUG SIGNPATH_POLICY_SLUG SIGNPATH_ARTIFACT_CONFIGURATION_SLUG \
                   SIGNPATH_PUBLISHER; do
            [ -n "${!v}" ] || unset "$v"
          done
          # The next steps check that a signed Windows build can verify its updates.
          if [ -n "${AZURE_CLIENT_ID:-}${SIGNPATH_API_TOKEN:-}" ]; then echo "HOPLINE_WIN_SIGNED=1" >> "$GITHUB_ENV"; fi
          # The Windows certificate variables must not reach a Windows build (CSC_LINK is the Mac certificate here).
          if [ "$RUNNER_OS" != macOS ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          # notarytool wants the App Store Connect key as a file.
          if [ -n "${APPLE_API_KEY_BASE64:-}" ]; then
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$APPLE_API_KEY"
          fi
          [ -n "${CSC_LINK:-}" ] || export CSC_IDENTITY_AUTO_DISCOVERY=false
          case "$RUNNER_OS" in
            macOS) [ -n "${CSC_LINK:-}" ] || echo "::notice::No Developer ID (MAC_CSC_LINK): ad-hoc signed, not notarized; updates are notify-only." ;;
            Windows) [ -n "${AZURE_CLIENT_ID:-}${SIGNPATH_API_TOKEN:-}" ] || echo "::notice::No Windows signing secrets: unsigned installer (SmartScreen warns)." ;;
          esac
          npm run ${{ matrix.script }} -w @hopline/desktop
      - name: Native modules are in the package for every arch
        shell: bash
        run: |
          cd apps/desktop/release
          check() { for f in "$@"; do [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }; echo "ok $f"; done; }
          m=resources/app.asar.unpacked/node_modules
          case "$RUNNER_OS" in
            Linux) check "linux-unpacked/$m/better-sqlite3/prebuilds/linux-x64.node" ;;
            Windows) check "win-unpacked/$m/better-sqlite3/prebuilds/win32-x64.node" ;;
            macOS)
              check "mac-arm64/Hopline.app/Contents/Resources/app.asar.unpacked/node_modules/better-sqlite3/prebuilds/darwin-arm64.node" \
                    "mac/Hopline.app/Contents/Resources/app.asar.unpacked/node_modules/better-sqlite3/prebuilds/darwin-x64.node" ;;
          esac
      - name: Fuses flipped, native modules load (--smoke), signed Windows builds verify updates
        shell: bash
        run: |
          cd apps/desktop
          case "$RUNNER_OS" in
            Linux)
              node scripts/check-fuses.mjs release/linux-unpacked/hopline linux
              xvfb-run --auto-servernum release/linux-unpacked/hopline --smoke ;;
            Windows)
              node scripts/check-fuses.mjs release/win-unpacked/hopline.exe win32
              release/win-unpacked/hopline.exe --smoke
              # H1: without publisherName in app-update.yml, electron-updater installs any installer
              # whose sha512 matches the feed. A signed build must carry it.
              if [ "${HOPLINE_WIN_SIGNED:-}" = 1 ]; then
                grep -q '^publisherName:' release/win-unpacked/resources/app-update.yml \
                  || { echo "::error::Signed Windows build without publisherName in app-update.yml (set AZURE_SIGN_PUBLISHER or SIGNPATH_PUBLISHER)"; exit 1; }
              fi ;;
            macOS)
              node scripts/check-fuses.mjs release/mac-arm64/Hopline.app darwin
              node scripts/check-fuses.mjs release/mac/Hopline.app darwin
              release/mac-arm64/Hopline.app/Contents/MacOS/Hopline --smoke ;;
          esac
      - name: Verify the signed Windows app and installer
        if: runner.os == 'Windows' && env.HOPLINE_WIN_SIGNED == '1'
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ secrets.AZURE_CLIENT_ID && secrets.AZURE_SIGN_PUBLISHER || secrets.SIGNPATH_PUBLISHER }}
        run: |
          $release = 'apps/desktop/release'
          $installers = @(Get-ChildItem "$release/Hopline-*-win-x64.exe" -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          foreach ($file in @("$release/win-unpacked/hopline.exe", $installers[0].FullName)) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne 'Valid') { throw "Invalid signature on $file" }
            $publisher = $signature.SignerCertificate.GetNameInfo('SimpleName', $false)
            if ($publisher -cne $env:EXPECTED_PUBLISHER) { throw "Unexpected publisher on $file" }
          }
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: hopline-${{ matrix.name }}
          # The installers, the update feeds (latest*.yml / beta*.yml) and block maps for differential updates.
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
            apps/desktop/release/beta*.yml
            apps/desktop/release/alpha*.yml
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    # The GPG release key is an environment secret too.
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hopline-*
          path: dist
          merge-multiple: true
      - name: Staged rollout
        env:
          STAGING: ${{ inputs.staging_percentage || '100' }}
        run: node scripts/release/cli.mjs stage dist "$STAGING"
      - name: SHA-256 sums
        run: node scripts/release/cli.mjs sums dist
      - name: GPG signatures (when GPG_PRIVATE_KEY is set)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: bash scripts/release/gpg-sign.sh dist
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: hopline-release
          path: dist/*
      - name: Draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=()
          case "$TAG" in *-*) pre=(--prerelease) ;; esac
          gh release create "$TAG" --draft --verify-tag "${pre[@]}" --title "${TAG#v}" --generate-notes dist/*
