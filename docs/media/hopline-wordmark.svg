<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 144" role="img" aria-labelledby="title desc">
  <title id="title">Hopline Terminal</title>
  <desc id="desc">The Hopline Terminal mark connects two endpoints. SSH, Telnet and serial.</desc>
  <style>
    .packet { animation: hop 2.4s cubic-bezier(.16,1,.3,1) 1 both; transform-origin: 90px 87px; }
    @keyframes hop { 0%,12% {transform: rotate(0);opacity:0} 24% {opacity:1} 78%,100% {transform:rotate(180deg);opacity:0} }
    @media (prefers-reduced-motion: reduce) { .packet {display:none} }
  </style>
  <rect width="960" height="144" rx="14" fill="#121619"/>
  <g fill="none" stroke="#67cfbb">
    <path d="M54 87a36 36 0 0 1 72 0" stroke-width="9"/>
    <circle cx="54" cy="87" r="11" fill="#121619" stroke-width="7"/>
    <circle cx="126" cy="87" r="14" fill="#67cfbb"/>
  </g>
  <circle class="packet" cx="54" cy="87" r="4" fill="#e2fff8" opacity="0"/>
  <text x="164" y="92" fill="#f0f5f3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="56" font-weight="650" letter-spacing="-2">Hopline Terminal</text>
  <text x="918" y="84" text-anchor="end" fill="#b8c8c6" font-family="ui-monospace,Consolas,monospace" font-size="22">SSH · TELNET · SERIAL</text>
</svg>
